<svg width="860" height="310" viewBox="0 0 860 310" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,monospace">

  <!-- Card background -->
  <rect width="860" height="310" fill="#0b1221" rx="14"/>

  <!-- Terminal title bar -->
  <rect width="860" height="44" fill="#0d1b35" rx="14"/>
  <rect y="30" width="860" height="14" fill="#0d1b35"/>

  <!-- Window controls -->
  <circle cx="26" cy="22" r="7" fill="#ff5f57"/>
  <circle cx="50" cy="22" r="7" fill="#ffbd2e"/>
  <circle cx="74" cy="22" r="7" fill="#28c840"/>

  <!-- Tab title -->
  <text x="430" y="27" text-anchor="middle" fill="#374151" font-size="12" letter-spacing="0.5">~/nikatopu — skills.sh</text>

  <!-- Prompt -->
  <text x="26" y="72" fill="#22d3ee" font-size="14" font-weight="bold">❯</text>
  <text x="44" y="72" fill="#f1f5f9" font-size="13">cat skills.json</text>

  <!-- Blinking cursor -->
  <rect x="172" y="59" width="8" height="15" fill="#22d3ee" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- ── TypeScript ── -->
  <text x="26" y="107" fill="#22d3ee" font-size="13" font-weight="600">TypeScript</text>
  <rect x="178" y="96" width="622" height="13" fill="#1e293b" rx="6"/>
  <rect x="178" y="96" width="0" height="13" fill="#22d3ee" rx="6" opacity="0.9">
    <animate attributeName="width" from="0" to="591" begin="0.2s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="828" y="107" text-anchor="end" fill="#374151" font-size="11">95%</text>

  <!-- ── Next.js ── -->
  <text x="26" y="141" fill="#f1f5f9" font-size="13" font-weight="600">Next.js</text>
  <rect x="178" y="130" width="622" height="13" fill="#1e293b" rx="6"/>
  <rect x="178" y="130" width="0" height="13" fill="#2dd4bf" rx="6" opacity="0.9">
    <animate attributeName="width" from="0" to="560" begin="0.4s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="828" y="141" text-anchor="end" fill="#374151" font-size="11">90%</text>

  <!-- ── React ── -->
  <text x="26" y="175" fill="#f1f5f9" font-size="13" font-weight="600">React</text>
  <rect x="178" y="164" width="622" height="13" fill="#1e293b" rx="6"/>
  <rect x="178" y="164" width="0" height="13" fill="#22d3ee" rx="6" opacity="0.75">
    <animate attributeName="width" from="0" to="541" begin="0.6s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="828" y="175" text-anchor="end" fill="#374151" font-size="11">87%</text>

  <!-- ── GSAP ── -->
  <text x="26" y="209" fill="#f1f5f9" font-size="13" font-weight="600">GSAP</text>
  <rect x="178" y="198" width="622" height="13" fill="#1e293b" rx="6"/>
  <rect x="178" y="198" width="0" height="13" fill="#fbbf24" rx="6" opacity="0.9">
    <animate attributeName="width" from="0" to="498" begin="0.8s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="828" y="209" text-anchor="end" fill="#374151" font-size="11">80%</text>

  <!-- ── Node.js ── -->
  <text x="26" y="243" fill="#f1f5f9" font-size="13" font-weight="600">Node.js</text>
  <rect x="178" y="232" width="622" height="13" fill="#1e293b" rx="6"/>
  <rect x="178" y="232" width="0" height="13" fill="#2dd4bf" rx="6" opacity="0.75">
    <animate attributeName="width" from="0" to="435" begin="1.0s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="828" y="243" text-anchor="end" fill="#374151" font-size="11">70%</text>

  <!-- ── Python ── -->
  <text x="26" y="277" fill="#f1f5f9" font-size="13" font-weight="600">Python</text>
  <rect x="178" y="266" width="622" height="13" fill="#1e293b" rx="6"/>
  <rect x="178" y="266" width="0" height="13" fill="#fbbf24" rx="6" opacity="0.55">
    <animate attributeName="width" from="0" to="311" begin="1.2s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>
  <text x="828" y="277" text-anchor="end" fill="#374151" font-size="11">50%</text>

</svg>
