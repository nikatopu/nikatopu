<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1280 340" width="100%"
     role="img" aria-label="Nikoloz Topuridze — Full-Stack Engineer building products, tools and systems">

  <defs>
    <!-- ── Gradients ── -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b1221"/>
      <stop offset="100%" stop-color="#0d1a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="scan-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1e3a5f" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#1e3a5f" stop-opacity="0.6"/>
      <stop offset="70%"  stop-color="#1e3a5f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0"/>
    </linearGradient>

    <!-- ── Glow sources ── -->
    <radialGradient id="gl1" cx="18%" cy="50%" r="52%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gl2" cx="83%" cy="45%" r="40%">
      <stop offset="0%"   stop-color="#2dd4bf" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gl3" cx="80%" cy="88%" r="30%">
      <stop offset="0%"   stop-color="#fbbf24" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- ── Dot grid ── -->
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.75" fill="#1e3a5f" opacity="0.38"/>
    </pattern>

    <!-- ── Clip ── -->
    <clipPath id="clip"><rect width="1280" height="340" rx="14"/></clipPath>

    <!-- ── animateMotion paths (data packets) ── -->
    <path id="p1" d="M873,49  C940,58  986,68 1026,80"/>
    <path id="p2" d="M1026,80 C1004,115 987,145 962,172"/>
    <path id="p3" d="M962,172 C1022,160 1064,148 1118,133"/>
    <path id="p4" d="M812,162 C825,202  837,240  844,272"/>
    <path id="p5" d="M962,172 C967,215  974,258  976,298"/>

    <!-- ── Styles ── -->
    <style>
      .m { font-family: 'SFMono-Regular',Consolas,'Liberation Mono',monospace; }
      .s { font-family: 'Segoe UI',Helvetica,Arial,sans-serif; }

      /* Entrance — CSS fade+rise */
      .ri { opacity:0; animation: ri .85s cubic-bezier(.2,.7,.2,1) both; }
      .d0{animation-delay:.05s}.d1{animation-delay:.2s}.d2{animation-delay:.42s}
      .d3{animation-delay:.65s}.d4{animation-delay:.88s}.d5{animation-delay:1.15s}
      @keyframes ri { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

      /* Node twinkle */
      .tw  { animation: tw 3.5s ease-in-out infinite; }
      .tw2 { animation: tw 4.3s ease-in-out infinite .7s; }
      .tw3 { animation: tw 5.1s ease-in-out infinite 1.4s; }
      @keyframes tw { 0%,100%{opacity:.28} 50%{opacity:1} }

      /* Network drift */
      .da { animation: da 12s ease-in-out infinite; }
      .db { animation: db 17s ease-in-out infinite; }
      .dc { animation: dc 9s  ease-in-out infinite; }
      @keyframes da { 0%,100%{transform:translate(0,0)} 50%{transform:translate(11px,-9px)} }
      @keyframes db { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-9px,13px)} }
      @keyframes dc { 0%,100%{transform:translate(0,0)} 50%{transform:translate(6px,7px)} }

      /* Cursor */
      .cur { animation: cur 1.1s steps(1) infinite; }
      @keyframes cur { 0%,49%{opacity:1} 50%,100%{opacity:0} }

      /* Scan line */
      .scn { animation: scn 7.5s linear .5s infinite; }
      @keyframes scn { from{transform:translateX(-130px)} to{transform:translateX(1420px)} }

      @media(prefers-reduced-motion:reduce){
        .ri,.tw,.tw2,.tw3,.da,.db,.dc,.cur,.scn{ animation:none; opacity:1; transform:none; }
      }
    </style>
  </defs>

  <!-- ════ BASE ════ -->
  <rect width="1280" height="340" rx="14" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="14" fill="url(#dots)"/>
  <rect width="1280" height="340" rx="14" fill="url(#gl1)"/>
  <rect width="1280" height="340" rx="14" fill="url(#gl2)"/>
  <rect width="1280" height="340" rx="14" fill="url(#gl3)"/>

  <!-- Scan shimmer -->
  <g clip-path="url(#clip)">
    <rect class="scn" y="0" width="130" height="340" fill="url(#scan-g)" opacity="0.033"/>
  </g>

  <!-- ════ NETWORK ════ -->
  <g clip-path="url(#clip)">

    <!-- Edges — drift layer A -->
    <g class="da" stroke="#1e3a5f" stroke-width="1" fill="none">
      <line x1="773"  y1="79"  x2="873"  y2="49"/>
      <line x1="873"  y1="49"  x2="1026" y2="80"/>
      <line x1="1026" y1="80"  x2="1118" y2="133"/>
      <line x1="1026" y1="80"  x2="962"  y2="172"/>
      <line x1="962"  y1="172" x2="1118" y2="133"/>
      <line x1="1118" y1="133" x2="1196" y2="96"/>
      <line x1="873"  y1="49"  x2="962"  y2="172"/>
    </g>

    <!-- Edges — drift layer B -->
    <g class="db" stroke="#1e3a5f" stroke-width="1" fill="none">
      <line x1="773"  y1="79"  x2="812"  y2="162"/>
      <line x1="812"  y1="162" x2="962"  y2="172"/>
      <line x1="812"  y1="162" x2="751"  y2="222"/>
      <line x1="751"  y1="222" x2="844"  y2="272"/>
      <line x1="844"  y1="272" x2="976"  y2="298"/>
      <line x1="976"  y1="298" x2="1140" y2="263"/>
      <line x1="1140" y1="263" x2="1196" y2="96"/>
      <line x1="1118" y1="133" x2="1140" y2="263"/>
      <line x1="962"  y1="172" x2="976"  y2="298"/>
      <line x1="962"  y1="172" x2="1061" y2="235"/>
      <line x1="1061" y1="235" x2="1140" y2="263"/>
    </g>

    <!-- SMIL Pulse rings on the two hubs -->
    <!-- Hub C -->
    <circle class="da" cx="1026" cy="80" r="9" fill="none" stroke="#22d3ee" stroke-width="1.5">
      <animate attributeName="r"            values="9;32"    dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity"      values="0.7;0"   dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1.5;0.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Hub E -->
    <circle class="db" cx="962" cy="172" r="7" fill="none" stroke="#2dd4bf" stroke-width="1.2">
      <animate attributeName="r"            values="7;26"    dur="3.2s" repeatCount="indefinite" begin="1.1s"/>
      <animate attributeName="opacity"      values="0.7;0"   dur="3.2s" repeatCount="indefinite" begin="1.1s"/>
      <animate attributeName="stroke-width" values="1.2;0.2" dur="3.2s" repeatCount="indefinite" begin="1.1s"/>
    </circle>

    <!-- Nodes — drift layer A -->
    <g class="da">
      <circle class="tw"  cx="773"  cy="79"  r="3.5" fill="#22d3ee"/>
      <circle class="tw2" cx="873"  cy="49"  r="4.5" fill="#2dd4bf"/>
      <circle class="tw"  cx="1026" cy="80"  r="8"   fill="#22d3ee"/>  <!-- hub C -->
      <circle class="tw3" cx="1118" cy="133" r="4.5" fill="#2dd4bf"/>
      <circle class="tw2" cx="1196" cy="96"  r="3"   fill="#22d3ee"/>
    </g>

    <!-- Nodes — drift layer B -->
    <g class="db">
      <circle class="tw2" cx="812"  cy="162" r="4"   fill="#2dd4bf"/>
      <circle class="tw"  cx="962"  cy="172" r="7"   fill="#22d3ee"/>  <!-- hub E -->
      <circle class="tw3" cx="751"  cy="222" r="2.5" fill="#22d3ee"/>
      <circle class="tw"  cx="844"  cy="272" r="3.5" fill="#2dd4bf"/>
      <circle class="tw2" cx="976"  cy="298" r="4.5" fill="#fbbf24"/>
      <circle class="tw"  cx="1140" cy="263" r="3"   fill="#22d3ee"/>
      <circle class="tw3" cx="1061" cy="235" r="4"   fill="#2dd4bf"/>
    </g>

    <!-- Ambient floating dots — drift layer C -->
    <g class="dc" opacity="0.5">
      <circle class="tw2" cx="1074" cy="55"  r="2"   fill="#2dd4bf"/>
      <circle class="tw3" cx="898"  cy="130" r="1.8" fill="#22d3ee"/>
      <circle class="tw"  cx="1167" cy="196" r="2"   fill="#fbbf24"/>
      <circle class="tw2" cx="729"  cy="148" r="1.8" fill="#22d3ee"/>
      <circle class="tw3" cx="1090" cy="310" r="1.5" fill="#2dd4bf"/>
    </g>

    <!-- ── Data packets (SMIL animateMotion) ── -->
    <circle r="2.5" fill="#22d3ee" opacity="0.9">
      <animateMotion dur="2.4s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#p1"/></animateMotion>
    </circle>
    <circle r="2" fill="#2dd4bf" opacity="0.85">
      <animateMotion dur="2.1s" repeatCount="indefinite" begin="0.9s"><mpath xlink:href="#p2"/></animateMotion>
    </circle>
    <circle r="2" fill="#22d3ee" opacity="0.8">
      <animateMotion dur="2.7s" repeatCount="indefinite" begin="1.5s"><mpath xlink:href="#p3"/></animateMotion>
    </circle>
    <circle r="1.8" fill="#fbbf24" opacity="0.75">
      <animateMotion dur="3.0s" repeatCount="indefinite" begin="0.4s"><mpath xlink:href="#p4"/></animateMotion>
    </circle>
    <circle r="2" fill="#2dd4bf" opacity="0.8">
      <animateMotion dur="2.5s" repeatCount="indefinite" begin="1.2s"><mpath xlink:href="#p5"/></animateMotion>
    </circle>

  </g><!-- /network clip -->

  <!-- Vertical separator -->
  <rect x="716" y="0" width="1" height="340" fill="url(#sep)"/>

  <!-- ════ TYPOGRAPHY ════ -->
  <g transform="translate(64,88)">

    <!-- Eyebrow -->
    <text class="m ri d0" x="0" y="0" font-size="13" fill="#22d3ee" letter-spacing="2" opacity="0">
      // Full-Stack Engineer · Studio Glitch
    </text>

    <!-- Name -->
    <text class="s ri d1" x="-2" y="70" font-size="68" font-weight="700" fill="#f1f5f9" letter-spacing="-1.5" opacity="0">
      Nikoloz Topuridze
    </text>

    <!-- Underline (SMIL draw) -->
    <rect x="0" y="88" height="4" rx="2" fill="url(#accent)" width="0">
      <animate attributeName="width" from="0" to="390"
               begin="0.55s" dur="1.1s" fill="freeze"
               calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>

    <!-- Subtitle -->
    <text class="s ri d2" x="0" y="124" font-size="21" font-weight="400" fill="#94a3b8" opacity="0">
      Helping Brands Turn Visitors Into Clients
    </text>

    <!-- Tag line -->
    <text class="m ri d3" x="0" y="166" font-size="15" opacity="0">
      <tspan fill="#22d3ee">products</tspan>
      <tspan fill="#475569"> · </tspan>
      <tspan fill="#2dd4bf">tools</tspan>
      <tspan fill="#475569"> · </tspan>
      <tspan fill="#fbbf24">systems</tspan>
      <tspan class="cur" fill="#94a3b8" dx="6">_</tspan>
    </text>

    <!-- Status pill -->
    <g class="ri d5" opacity="0">
      <rect x="0" y="185" width="162" height="26" rx="13"
            fill="#0d1b35" stroke="#1e3a5f" stroke-width="1"/>

      <circle cx="16" cy="198" r="4" fill="#22c55e">
        <animate attributeName="opacity"
                values="0.5;1;0.5"
                dur="2s"
                repeatCount="indefinite"/>
        <animate attributeName="r"
                values="3.5;5;3.5"
                dur="2s"
                repeatCount="indefinite"/>
      </circle>

      <text class="m"
            x="30"
            y="202"
            font-size="11"
            fill="#64748b"
            letter-spacing="0.8">
        available
      </text>
    </g>

  </g>

</svg>
